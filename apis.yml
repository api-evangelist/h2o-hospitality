name: H2O Hospitality
description: >-
  H2O Hospitality is a South Korea-based hospitality digital-transformation
  company that connects existing hotel and leisure systems rather than replacing
  them, streamlining operations from booking to checkout. Its products span
  three areas: Connect (cloud property-management tooling including Smart CRS,
  Smart RMS, and Smart FMS), Maximize (revenue and guest-engagement tools such
  as Smart D2C and AI-based CRM), and Transform (managed operations). It offers
  smart mobile check-in and automated inventory management, operates across nine
  countries in Korea, Japan, Southeast Asia, and the Middle East, and is ISO
  27001 and ISO 27701 certified. As of this enrichment pass the company
  publishes no public API, OpenAPI, or developer portal.
